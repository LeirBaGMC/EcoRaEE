name: Verificar y empaquetar
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r backend/requirements.txt
      - run: python -m unittest discover -s tests -t .
        working-directory: backend
      - uses: actions/upload-artifact@v4
        with:
          name: ecoraee-backend-${{ github.sha }}
          path: |
            backend/app/
            backend/scripts/
            backend/requirements.txt
            backend/ecoraee_cloud_sqlserver.sql
            deploy/ec2/
            !backend/**/__pycache__/**
          if-no-files-found: error
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: ecoraee-frontend-${{ github.sha }}
          path: frontend/dist/
          if-no-files-found: error
