# Instalar como /etc/nginx/sites-available/ecoraee; desactivar el sitio default.
server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 11m;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # En esta arquitectura el acceso externo es exclusivamente HTTPS por CloudFront.
        # Restringir el acceso de EC2 al SG del ALB y el origen ALB a CloudFront.
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
